name: dataportergen-generation-e2e

services:
  mongo-generation:
    image: mongo:7.0.14
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: generation_root_local_only
      MONGO_INITDB_ROOT_PASSWORD: generation_password_local_only
    volumes:
      - mongo-generation-data:/data/db
      - ./docker/mongo-generation-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username generation_root_local_only --password generation_password_local_only --authenticationDatabase admin --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks: [generation]

  dataportergen:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        rm -f /app/reports/generation-complete
        java -jar /app/DataPorterGen.jar
        touch /app/reports/generation-complete
        exec tail -f /dev/null
    environment:
      MIGRATION_MODE: GENERATE
      SOURCE_MONGODB_URI: mongodb://generation_root_local_only:generation_password_local_only@mongo-generation:27017/?authSource=admin
      SOURCE_DATABASE: generation_catalog
      TARGET_MONGODB_URI: mongodb://generation_root_local_only:generation_password_local_only@mongo-generation:27017/?authSource=admin
      TARGET_DATABASE: generation_catalog
      GENERATION_CONFIG_PATH: /app/config/generation.yml
      GENERATION_VALIDATE_ONLY: "false"
      MIGRATION_REPORT_PATH: /app/reports/generation-report.json
    volumes:
      - ./docker/generation/generation.yml:/app/config/generation.yml:ro
      - generation-reports:/app/reports
    depends_on:
      mongo-generation:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/reports/generation-complete"]
      interval: 1s
      timeout: 1s
      retries: 120
      start_period: 1s
    networks: [generation]

  generation-verifier:
    image: mongo:7.0.14
    environment:
      MONGODB_URI: mongodb://generation_root_local_only:generation_password_local_only@mongo-generation:27017/?authSource=admin
      DATABASE: generation_catalog
    volumes:
      - ./docker/generation/verify.js:/verification/verify.js:ro
    entrypoint: ["mongosh", "--nodb", "--quiet", "/verification/verify.js"]
    depends_on:
      mongo-generation:
        condition: service_healthy
      dataportergen:
        condition: service_healthy
    networks: [generation]

networks:
  generation:
    driver: bridge

volumes:
  mongo-generation-data:
  generation-reports:
