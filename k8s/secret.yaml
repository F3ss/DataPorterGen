apiVersion: v1
kind: Secret
metadata:
  name: dataportergen-secret
  labels:
    app: dataportergen
type: Opaque
stringData:
  # Замените на ваши реквизиты доступа к MongoDB
  SOURCE_MONGODB_URI: "mongodb://source-mongodb:27017/?authSource=admin"
  TARGET_MONGODB_URI: "mongodb://target-mongodb:27017/?authSource=admin"
